name: Bug report
description: Report something Wick did wrong, like sleeping when it shouldn't.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Wick version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and computer
      description: OS version, the computer, and on Linux the desktop and how you installed Wick.
      placeholder: macOS 26.1, MacBook Air M2 · Windows 11 24H2 · Ubuntu 24.04, GNOME, AppImage
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Sessions, Triggers, Also keeping awake, Battery, Menu bar icon, Settings, Updates, Installation]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Steps, what you expected, and what happened. If the computer slept or stayed awake unexpectedly, paste what keeps it awake: `pmset -g assertions` on macOS, `powercfg /requests` (as administrator) on Windows, `systemd-inhibit --list` on Linux.
    validations:
      required: true
