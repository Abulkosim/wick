name: Feature request
description: Suggest a change to how Wick keeps the Mac awake.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Wick keeps the Mac awake with standard power assertions and never changes system settings. It does not move the mouse or fake activity.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Wick do or show? Mockups help.
    validations:
      required: true
