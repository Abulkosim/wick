version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /raycast
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      raycast:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /scripts/linux
    schedule:
      interval: weekly
    ignore:
      # The container matches the release build base, Ubuntu 22.04 (glibc 2.35).
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.21.2 added public fields to ParseOption, which tauri-plugin-deep-link 2.6 builds on Linux.
      - dependency-name: rust-ini
        versions: [">=0.21.2"]
    groups:
      rust:
        patterns: ["*"]
