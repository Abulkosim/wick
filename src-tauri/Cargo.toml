[package]
name = "wick"
version = "0.8.0"
description = "Keeps your computer awake"
authors = ["abulkosim <abulkasimkattaev@gmail.com>"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Abulkosim/wick"

[lib]
name = "wick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# Exact: the release scripts and install tests check this version's signature format and
# requireSignedVersion; bump it together with them.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Cargo.lock keeps its rust-ini at 0.21.1: deep-link 2.6 doesn't build with 0.21.2 and newer
# (Dependabot ignores those), so update rust-ini only with a deep-link that does.
tauri-plugin-deep-link = "2"

[dev-dependencies]
chrono-tz = "0.10"
png = "0.18"
tauri = { version = "2.12.4", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSVisualEffectView", "NSWindow", "NSScreen", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSFont", "NSFontDescriptor", "objc2-core-foundation", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# StatusNotifierItem instead of libappindicator: a left click reaches Wick (AppIndicator only
# ever opens the menu) and no libappindicator is needed at run time.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
